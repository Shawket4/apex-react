name: Build and Deploy Apex Fleet Dashboard

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build
        env:
          # Sentry is off unless a DSN reaches the build. Vite inlines VITE_*
          # at build time, so this has to be here — setting it on the server
          # does nothing for a static bundle.
          #
          # A repo VARIABLE, not a secret: a browser DSN is public by design,
          # it ends up readable in the shipped JS either way, and pretending
          # otherwise just makes it harder to see what is configured.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          # One release per commit, so an error can be traced to a deploy.
          VITE_SENTRY_RELEASE: apex-react@${{ github.sha }}
          # Source maps upload only when all three are present; the plugin then
          # deletes the .map files so users never receive them. Absent secrets
          # simply mean no upload and an unchanged build.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_RELEASE: apex-react@${{ github.sha }}
        # Vite outputs to dist/ by default
        # build script runs: tsc --noEmit && vite build
        # If tsc finds type errors, the build will fail here — fix them or
        # temporarily change the build script to just "vite build" in package.json

      - name: Set up SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: github-actions-deploy
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: replace
          config: |
            Host vps
              HostName ${{ secrets.SSH_HOST }}
              User ${{ secrets.SSH_USER }}
              Port ${{ secrets.SSH_PORT }}
              IdentityFile ~/.ssh/github-actions-deploy
              StrictHostKeyChecking yes

      - name: Clear old build on VPS
        run: ssh vps "rm -rf ${{ secrets.DEPLOY_PATH }}/* && mkdir -p ${{ secrets.DEPLOY_PATH }}"
        # Clears stale files before deploying — important for Vite's hashed filenames

      - name: Deploy dist to VPS
        run: scp -r dist/* vps:${{ secrets.DEPLOY_PATH }}

      - name: Set permissions
        run: ssh vps "chmod -R 755 ${{ secrets.DEPLOY_PATH }}"

      - name: Verify deployment
        run: |
          ssh vps "cd ${{ secrets.DEPLOY_PATH }} && ls -la"
          echo "🚀 Apex Fleet Dashboard deployed successfully!"